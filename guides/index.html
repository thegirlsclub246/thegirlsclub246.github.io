<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<style>:root{color-scheme:only light}</style>
<title>Free guides · Shop Bajan</title>
<meta name="description" content="Free guides and tools for Barbados creators and small businesses from Shop Bajan.">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Quicksand:wght@500;600;700&display=swap">
<style>
:root{--blue:#00267F;--navy:#001447;--gold:#FFC72C;--sun:#FFF3C7;--cream:#FFF9EC;--coral:#FF6F59;--ink:#16213E;--muted:#4A5675;--line:#DCE4F5;
--serif:"Fraunces",Georgia,serif;--body:"Quicksand","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;font-weight:500}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.brand{display:flex;align-items:center;gap:10px;color:var(--blue);font-family:var(--serif);font-weight:800;font-size:1.35rem}
.brand img{width:38px;height:38px}
.label{display:flex;align-items:center;gap:14px;margin:26px 0 12px;font-weight:700;font-size:.78rem;letter-spacing:.3em;color:var(--blue)}
.label::before,.label::after{content:"";flex:1;height:2px;background:var(--blue)}
h1{font-family:var(--serif);font-weight:800;text-transform:uppercase;color:var(--blue);font-size:clamp(2rem,8vw,2.8rem);line-height:1.05;margin:0 0 12px}
h1 span{color:var(--coral)}
h2{font-family:var(--serif);font-weight:800;color:var(--blue);font-size:1.6rem;line-height:1.15;margin:0 0 6px}
p.lead{color:var(--muted);margin:0 0 22px}
.card{background:#fff;border:2.5px solid var(--blue);border-radius:22px;padding:14px;box-shadow:5px 5px 0 var(--gold)}
.band{background:var(--blue);color:#fff;border-radius:18px;padding:16px 18px;margin-top:22px;font-weight:600}
.band a{color:var(--gold)}
.shop{margin-top:40px}
.shop>p{color:var(--muted);margin:0 0 16px}
.items{display:grid;gap:14px}
.item{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.item .tag{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--sun);color:var(--blue)}
.item .tag.paid{background:var(--coral);color:#fff}
.item h3{font-family:var(--serif);font-weight:800;color:var(--blue);font-size:1.2rem;margin:0;line-height:1.2}
.item p{margin:0;color:var(--muted);font-size:.95rem}
.item .price{font-weight:700;color:var(--ink)}
.go{display:inline-flex;align-self:flex-start;align-items:center;gap:8px;margin-top:6px;min-height:46px;padding:0 20px;border-radius:999px;background:#fff;color:var(--blue);font:700 1rem var(--body);border:2.5px solid var(--blue);text-decoration:none}
.pay{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;min-height:56px;border-radius:999px;background:var(--gold);color:var(--blue);font:800 1.1rem var(--body);border:2.5px solid var(--blue);box-shadow:0 4px 0 var(--blue);text-decoration:none;animation:bounce 2.4s ease-in-out infinite}
.pay::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);animation:shine 2.4s ease-in-out infinite}
.pay .arrow{display:inline-block;animation:nudge 1.2s ease-in-out infinite}
.pay:hover{animation-play-state:paused;transform:translateY(-2px) scale(1.02)}
.pay:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue)}
@keyframes bounce{0%,70%,100%{transform:translateY(0)}78%{transform:translateY(-4px)}86%{transform:translateY(0)}92%{transform:translateY(-2px)}}
@keyframes shine{0%,55%{left:-60%}85%,100%{left:130%}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.pay,.pay::after,.pay .arrow{animation:none}}
.item.mine{border-color:var(--blue);box-shadow:4px 4px 0 var(--gold)}
.getit{margin-top:44px;scroll-margin-top:16px}
.getit .small{color:var(--muted);margin:0 0 14px}
html{scroll-behavior:smooth}
footer{text-align:center;font-size:.85rem;color:var(--muted);margin-top:32px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<div class="brand"><img src="../shop-bajan-mark.png" alt="">Shop Bajan</div>
<div class="label">SHOP BAJAN</div>
<h1 id="title">Your free guide</h1>
<p class="lead" id="lead"></p>

<a class="pay" href="#get"><span>Take me to my freebie</span><span class="arrow" aria-hidden="true">↓</span></a>

<section class="shop" aria-labelledby="shopTitle">
  <div class="label">THE SHOP</div>
  <h2 id="shopTitle">Everything we've got for you</h2>
  <p>Free tools to help you build, and ways to grow with Shop Bajan.</p>
  <div class="items" id="items"></div>
</section>

<section id="get" class="getit">
  <div class="label">YOUR FREEBIE</div>
  <h2 id="getTitle"></h2>
  <div class="card">
    <div class="ml-embedded" id="mlform"></div>
  </div>
  <div class="band" id="next"></div>
</section>

<footer>shopbajanbb.com · @shopbajan<br>Results may vary.</footer>
</div>

<script>
/* Each key is one sign-up: ?g=digital|paid|ready|journey|founding.
   form = MailerLite embedded form id. Its success message holds the download link. */
var GUIDES = {
  digital: {form:"qpX8d2", title:"Make your first <span>digital product</span>", lead:"Free guide 1 of 2, made for you. Read it in 15 minutes, make your product this week.",
            next:'Want guide 2, on getting paid in Barbados? <a href="?g=paid">Get it here</a>.'},
  paid:    {form:"0KfmOj", title:"Get paid in <span>Barbados</span>", lead:"Free guide 2 of 2: what works from Barbados, what doesn't, and how to set up step by step.",
            next:'Missed guide 1, on making your first digital product? <a href="?g=digital">Get it here</a>.'},
  ready:   {form:"X4EwlU", title:"Your free <span>starter guides</span>", lead:"Both Shop Bajan guides in one: make your first digital product, then get paid for it from Barbados.",
            next:'Want to sell it on Shop Bajan? <a href="?g=founding">See our founding vendor spots</a>.'},
  journey: {form:"vbhLfX", title:"Your free <span>task tracker</span>", lead:"A simple tracker to help you get things out of your head and get them done.",
            next:'Ready to make something to sell? <a href="?g=ready">Get our free starter guides</a>.'},
  start:   {form:"usKdtF", file:"Shop-Bajan-Free-Guide-START-Start-With-0.pdf", title:"Start with <span>$0</span>", lead:"The free tools list: every free tool you need to make, sell and track your first digital product.", next:'Next: make your first product. <a href="?g=digital">Get the DIGITAL guide</a>.'},
  posts:   {form:"2UuBtA", file:"Shop-Bajan-Free-Guide-POSTS-The-Post-Kit.pdf", title:"The <span>Post Kit</span>", lead:"Free guide: what to post so people stop scrolling and start asking.", next:'Want more free guides? Scroll up to the shop.'},
  sales:   {form:"NjDIp4", file:"Shop-Bajan-Free-Guide-SALES-Views-to-Sales-Checklist.pdf", title:"Views to <span>sales</span>", lead:"Free checklist: turn views and likes into people who actually buy.", next:'Want more free guides? Scroll up to the shop.'},
  price:   {form:"oLt1q9", file:"Shop-Bajan-Free-Guide-PRICE-Pricing-Cheat-Sheet.pdf", title:"Pricing <span>cheat sheet</span>", lead:"Free guide: set a price that sells and still pays you.", next:'Want more free guides? Scroll up to the shop.'},
  reel:    {form:"wMdEAE", file:"Shop-Bajan-Free-Guide-REEL-15-Minute-Reel-Kit.pdf", title:"15-minute <span>reel kit</span>", lead:"Free guide: plan, film and post a reel in 15 minutes.", next:'Want more free guides? Scroll up to the shop.'},
  spark:   {form:"4BjXw7", file:"Shop-Bajan-Free-Guide-SPARK-Product-Idea-Finder.pdf", title:"Product <span>idea finder</span>", lead:"Free guide: find a product idea people already want.", next:'Got your idea? <a href="?g=digital">Get the DIGITAL guide</a> to make it.'},
  track:   {form:"dseAOn", file:"Shop-Bajan-Free-Guide-TRACK-Sales-and-Money-Tracker.pdf", title:"Sales and <span>money tracker</span>", lead:"Free tracker: log every sale and know where your money goes.", next:'Want more free guides? Scroll up to the shop.'},
  email:   {form:"OYahhp", file:"Shop-Bajan-Free-Guide-EMAIL-Email-Templates.pdf", title:"Email <span>templates</span>", lead:"Free templates: ready-to-send emails for your customers and your list.", next:'Want more free guides? Scroll up to the shop.'},
  founding:{form:"CNC8hq", title:"Founding <span>vendor spots</span>", lead:"The online marketplace for Barbados small businesses opens Thursday 10 December.",
            next:'Questions? Message us on Instagram <a href="https://instagram.com/shopbajan">@shopbajan</a>.'}
};

/* Storefront. Free items link to their sign-up. Paid items show the animated pay button.
   To add a paid product: {key:"", tag:"Paid", name:"", text:"", price:"BBD $00", pay:"https://your-payment-link"} */
var SHOP = [
  {key:"challenge5k", tag:"30-day challenge", name:"The 5K Month Bundle", text:"Both challenges in one: grow toward a 5,000 month with offers, content, Meta ads and emails. Results may vary. Not a promise of income.", price:"US$27 early price until Thu 10 Dec (then US$44)", pay:"https://checkout.dodopayments.com/buy/pdt_0NsMxcZqX88n9KeYzbKfc?quantity=1"},
  {key:"challenge1k", tag:"30-day challenge", name:"The 1K Month Bundle", text:"Make your first 1,000 from one product, digital or physical. One action a day for 30 days, with exact Claude prompts and templates. Results may vary. Not a promise of income.", price:"US$17 early price until Thu 10 Dec (then US$27)", pay:"https://checkout.dodopayments.com/buy/pdt_0NsMwq32ORiteWbY8KrO4?quantity=1"},
  {key:"ready",    tag:"Free guides", name:"Free starter guides", text:"Both guides in one: make your first digital product and get paid for it."},
  {key:"digital",  tag:"Free guide",  name:"Make your first digital product", text:"7 steps and copy-and-paste prompts. Read it in 15 minutes."},
  {key:"paid",     tag:"Free guide",  name:"Get paid in Barbados", text:"What works from Barbados, what doesn't, and how to set up."},
  {key:"start", tag:"Free guide", name:"Start with $0: the free tools list", text:"Every free tool you need to make, sell and track your first product."},
  {key:"spark", tag:"Free guide", name:"Product idea finder", text:"Find a product idea people already want."},
  {key:"price", tag:"Free guide", name:"Pricing cheat sheet", text:"Set a price that sells and still pays you."},
  {key:"posts", tag:"Free guide", name:"The Post Kit", text:"What to post so people stop scrolling and start asking."},
  {key:"reel", tag:"Free guide", name:"15-minute reel kit", text:"Plan, film and post a reel in 15 minutes."},
  {key:"sales", tag:"Free guide", name:"Views to sales checklist", text:"Turn views and likes into buyers."},
  {key:"email", tag:"Free guide", name:"Email templates", text:"Ready-to-send emails for your customers and your list."},
  {key:"track", tag:"Free guide", name:"Sales and money tracker", text:"Log every sale and know where your money goes."},
  {key:"journey",  tag:"Free tool",   name:"Task tracker", text:"Get it out of your head and onto one simple list."},
  {key:"hustlekit", tag:"App", name:"Hustle Kit booking app", text:"Clients book themselves from your link, pay the deposit up front and get reminded. No commission, cancel any time.", price:"US$12 a month (about BBD $24)", pay:"https://shopbajanbb.com/hustle-kit/"},
  {key:"depositproof", tag:"App", name:"DepositProof", text:"Do your move-in check on your phone and keep proof of your rental's condition, so your deposit comes back.", price:"Free to start · from US$9 a move · landlords US$19/month", pay:"https://shopbajanbb.com/depositproof/"},
  {key:"hustlecut", tag:"App", name:"Hustle Cut", text:"Turn your clips into reels: it cuts the pauses and adds captions and zooms, right in your browser.", price:"Free to use", pay:"https://shopbajanbb.com/hustle-cut/"},
  {key:"founding", tag:"Sell with us", name:"Founding vendor spots", text:"Limited founding spots on Shop Bajan. We open Thursday 10 December."}
];
var PAY_LABEL = "Leh we go!";

/* Hide free guides whose sign-up form isn't set up yet. */
SHOP = SHOP.filter(function(it){ return !GUIDES[it.key] || GUIDES[it.key].form; });
var key = (new URLSearchParams(location.search).get("g") || "digital").toLowerCase();
if (!GUIDES[key] || !GUIDES[key].form) key = "digital";
var g = GUIDES[key];
document.getElementById("title").innerHTML = g.title;
document.getElementById("lead").textContent = g.lead;
document.getElementById("next").innerHTML = g.next;
document.getElementById("mlform").setAttribute("data-form", g.form);
/* READY's MailerLite form still says "bundle"; reword it so the free guides aren't confused with the paid bundles. */
if (key === "ready"){
  new MutationObserver(function(){
    var c = document.querySelector("#mlform .ml-form-embedBody .ml-form-embedContent");
    if (!c || c.getAttribute("data-sb")) return;
    c.setAttribute("data-sb","1");
    var h = c.querySelector("h4"); if (h) h.textContent = "Get your free guides";
    var p = c.querySelector("p"); if (p) p.textContent = "Pop in your name and email and both free guides open straight away. We'll send the occasional Shop Bajan update too. Unsubscribe any time.";
    var b = document.querySelector("#mlform .ml-form-embedSubmit button[type=submit]"); if (b) b.textContent = "Get my guides";
    var sp = document.querySelector("#mlform .ml-form-successContent p"); if (sp) sp.textContent = "Here are your free guides. Tap each one to open it.";
  }).observe(document.getElementById("mlform"), {childList:true, subtree:true});
}
/* For guides with a file, write our own success message with the right download link. */
if (g.file){
  var fixSuccess = function(){
    var s = document.querySelector("#mlform .ml-form-successContent");
    if (!s || s.getAttribute("data-sb")) return;
    s.setAttribute("data-sb","1");
    s.innerHTML = '<h4>You\'re in!</h4><p>Here\'s your free guide. Tap below to open it.</p><p><a href="' + g.file + '" target="_blank" rel="noopener"><strong>Open my guide</strong></a></p>';
  };
  new MutationObserver(fixSuccess).observe(document.getElementById("mlform"), {childList:true, subtree:true});
}

var list = document.getElementById("items");
var mine = SHOP.filter(function(it){ return it.key === key; })[0];
document.getElementById("getTitle").textContent = mine ? mine.name : "Your freebie";
var ordered = (mine ? [mine] : []).concat(SHOP.filter(function(it){ return it.key !== key; }));
ordered.forEach(function(it){
  var isMine = it.key === key;
  var el = document.createElement("article");
  el.className = "item" + (isMine ? " mine" : "");
  var paid = !!it.pay || !!it.soon;
  el.innerHTML = '<span class="tag' + (paid ? ' paid' : '') + '"></span><h3></h3><p></p>' +
    (paid ? '<p class="price"></p><a class="pay" target="_blank" rel="noopener"><span></span><span class="arrow" aria-hidden="true">→</span></a>'
          : '<a class="go">Grab it free →</a>');
  el.querySelector(".tag").textContent = isMine ? "Yours, free" : it.tag;
  el.querySelector("h3").textContent = it.name;
  el.querySelector("p").textContent = it.text;
  if (paid){
    el.querySelector(".price").textContent = it.price;
    var a = el.querySelector(".pay");
    if (it.pay){ a.href = it.pay; a.querySelector("span").textContent = PAY_LABEL; }
    else { a.removeAttribute("href"); a.style.animation = "none"; a.style.opacity = ".6"; a.querySelector("span").textContent = "Pay link coming soon"; a.querySelector(".arrow").textContent = ""; }
  } else {
    var go = el.querySelector(".go");
    if (isMine){ go.href = "#get"; go.textContent = "Get mine now ↓"; } else { go.href = "?g=" + it.key; }
  }
  list.appendChild(el);
});
</script>
<script>
(function(w,d,e,u,f,l,n){w[f]=w[f]||function(){(w[f].q=w[f].q||[]).push(arguments);},l=d.createElement(e),l.async=1,l.src=u,n=d.getElementsByTagName(e)[0],n.parentNode.insertBefore(l,n);})(window,document,'script','https://assets.mailerlite.com/js/universal.js','ml');
ml('account', '2810799');
</script>
</body>
</html>
