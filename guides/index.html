<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free guides · Shop Bajan</title>
<meta name="description" content="Free guides for Barbados creators and small businesses from Shop Bajan.">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Quicksand:wght@500;600;700&display=swap">
<style>
:root{--blue:#00267F;--navy:#001447;--gold:#FFC72C;--sun:#FFF3C7;--cream:#FFF9EC;--coral:#FF6F59;--ink:#16213E;--muted:#4A5675;--line:#DCE4F5;
--serif:"Fraunces",Georgia,serif;--body:"Quicksand","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;font-weight:500}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
header a{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--blue);font-family:var(--serif);font-weight:800;font-size:1.35rem}
header img{width:38px;height:38px}
.label{display:flex;align-items:center;gap:14px;margin:30px 0 12px;font-weight:700;font-size:.78rem;letter-spacing:.3em;color:var(--blue)}
.label::before,.label::after{content:"";flex:1;height:2px;background:var(--blue)}
h1{font-family:var(--serif);font-weight:800;text-transform:uppercase;color:var(--blue);font-size:clamp(2rem,8vw,2.8rem);line-height:1.05;margin:0 0 12px}
h1 span{color:var(--coral)}
p.lead{color:var(--muted);margin:0 0 22px}
.card{background:#fff;border:2.5px solid var(--blue);border-radius:22px;padding:22px;box-shadow:5px 5px 0 var(--gold)}
label{display:block;font-weight:700;color:var(--blue);margin:0 0 6px}
input[type=text],input[type=email]{width:100%;min-height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:600 1rem var(--body);color:var(--ink);margin-bottom:14px}
input:focus{outline:3px solid var(--coral);outline-offset:1px;border-color:var(--blue)}
.btn{display:flex;width:100%;align-items:center;justify-content:center;min-height:54px;border-radius:999px;background:var(--gold);color:var(--blue);font:800 1.05rem var(--body);border:2.5px solid var(--blue);box-shadow:0 4px 0 var(--blue);cursor:pointer;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--blue)}
.small{font-size:.85rem;color:var(--muted);margin:12px 0 0}
.err{color:#B3261E;font-weight:700;margin:8px 0 0}
.done h2{font-family:var(--serif);color:var(--blue);margin:0 0 8px}
.band{background:var(--blue);color:#fff;border-radius:18px;padding:16px 18px;margin-top:22px;font-weight:600}
.band a{color:var(--gold)}
footer{text-align:center;font-size:.85rem;color:var(--muted);margin-top:28px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header><a href="../"><img src="../shop-bajan-mark.png" alt="">Shop Bajan</a></header>
<div class="label">SHOP BAJAN</div>
<h1 id="title">Your free guide</h1>
<p class="lead" id="lead">Pop in your name and email and we'll open your guide straight away.</p>

<div class="card">
  <div class="ml-embedded" id="mlform"></div>
</div>

<div class="band" id="next"></div>
<footer>shopbajanbb.com · @shopbajan</footer>
</div>

<script>
/* MailerLite free embedded forms, one per group: DIGITAL, PAID, FOUNDING.
   Each form's own success message holds the guide link. */
var GUIDES = {
  digital: {form:"qpX8d2", title:"Make your first <span>digital product</span>", lead:"Free guide 1 of 2 for Barbados creators. Read it in 15 minutes, make your product this week.",
            file:"Shop-Bajan-Guide-1-Create-a-Digital-Product.pdf", btn:"Get my guide",
            next:'Want guide 2, on getting paid in Barbados? <a href="?g=paid">Get it here</a>.'},
  paid:    {form:"0KfmOj", title:"Get paid in <span>Barbados</span>", lead:"Free guide 2 of 2: what works from Barbados, what doesn't, and how to set up step by step.",
            file:"Shop-Bajan-Guide-2-Get-Paid-in-Barbados.pdf", btn:"Get my guide",
            next:'Missed guide 1, on making your first digital product? <a href="?g=digital">Get it here</a>.'},
  ready:   {form:"X4EwlU", title:"Your free <span>digital starter bundle</span>", lead:"Both Shop Bajan guides in one: make your first digital product, then get paid for it from Barbados.",
            next:'Want to sell it on Shop Bajan? <a href="?g=founding">See our 10 founding spots</a>.'},
  founding:{form:"CNC8hq", title:"Founding <span>vendor spots</span>", lead:"The online marketplace for Barbados small businesses opens Thursday 10 December.",
            file:"../brands.html", btn:"Show me the details", done:"See founding spot details",
            next:'Questions? Message us on Instagram <a href="https://instagram.com/shopbajan">@shopbajan</a>.'}
};
var key = (new URLSearchParams(location.search).get("g") || "digital").toLowerCase();
var g = GUIDES[key] || GUIDES.digital;
document.getElementById("title").innerHTML = g.title;
document.getElementById("lead").textContent = g.lead;
document.getElementById("next").innerHTML = g.next;
document.getElementById("mlform").setAttribute("data-form", g.form);
</script>
<script>
(function(w,d,e,u,f,l,n){w[f]=w[f]||function(){(w[f].q=w[f].q||[]).push(arguments);},l=d.createElement(e),l.async=1,l.src=u,n=d.getElementsByTagName(e)[0],n.parentNode.insertBefore(l,n);})(window,document,'script','https://assets.mailerlite.com/js/universal.js','ml');
ml('account', '2810799');
</script>
</body>
</html>
