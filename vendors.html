:root{

html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;font-weight:500;min-height:100vh}

a{color:var(--deep)}

.small{font-size:14px}

.r{background:#fff;border:2px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.r .l{min-width:0}
.r .l b{display:block;overflow-wrap:anywhere}
.r .l span{font-size:14px;color:var(--muted)}
.r .v{font-weight:700;white-space:nowrap;text-align:right}
.r .v span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.empty{background:#fff;border:2px dashed var(--line);border-radius:16px;padding:20px;text-align:center;color:var(--muted);font-weight:600;margin-top:12px}

/* sheet (add/edit) */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(74,20,61,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--bg);width:100%;max-width:760px;max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) 28px}
@media(min-width:800px){.sheet{align-items:center}.sheet .panel{border-radius:24px}}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .head h2{font-size:21px}

/* auth */
.auth{max-width:460px;margin:0 auto}

</style>

function loadVendor(){

function money_owed(sales,payouts){
  var ws=iso(weekStart()),earned=0,due=0,thisWeek=0,paid=0;
  sales.forEach(function(s){var v=Number(s.vendor_share)||0;earned+=v;if(s.sale_date<ws)due+=v;else thisWeek+=v});
  payouts.forEach(function(p){paid+=Number(p.amount)||0});
  return{earned:earned,paid:paid,dueSunday:Math.max(0,due-paid),thisWeek:thisWeek,owed:Math.max(0,earned-paid)};
}

function compress(file){return new Promise(function(res,rej){
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){var max=1000,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
    var c=document.createElement("canvas");c.width=Math.round(w*s);c.height=Math.round(h*s);
    var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(function(b){b?res(b):rej(new Error("Couldn't read that photo"))},"image/jpeg",0.84)};
  img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("That file isn't a photo we can read. Try a JPG or PNG."))};
  img.src=url;})}

  function fillPrice(){var p=S.all.products.find(function(x){return x.id===f.product.value});if(p)f.price.value=Number(p.price).toFixed(2);calc()}
  function calc(){var v=vById(f.vendor.value),r=rateOf(v),t=(Number(f.qty.value)||0)*(Number(f.price.value)||0);q("#xk",d).innerHTML="Total "+money2(t)+" · vendor gets <b>"+money2(t*(1-r))+"</b> · you keep "+money2(t*r)+" ("+Math.round(r*100)+"%)"}
  f.vendor.onchange=fillP;f.product.onchange=fillPrice;f.oninput=calc;fillP();
  f.onsubmit=function(e){e.preventDefault();var p=S.all.products.find(function(x){return x.id===f.product.value});if(!p)return setErr(q("#xerr",d),"Pick a product.");
    var v=vById(f.vendor.value),r=rateOf(v),qty=Math.max(1,parseInt(f.qty.value,10)||1),unit=Number(f.price.value)||0,tot=Math.round(qty*unit*100)/100,com=Math.round(tot*r*100)/100;
    sb.from("sales").insert({vendor_id:v.id,product_id:p.id,product_name:p.name,qty:qty,unit_price:unit,total:tot,rate:r,commission:com,vendor_share:Math.round((tot-com)*100)/100,sale_date:f.date.value||today(),source:"in-person",order_ref:"IP-"+Date.now()}).select().single().then(function(x){
      if(x.error)return setErr(q("#xerr",d),friendly(x.error));S.all.sales.unshift(x.data);
      if(!p.digital){var ns=Math.max(0,(Number(p.stock)||0)-qty);sb.from("products").update({stock:ns}).eq("id",p.id).select().single().then(function(y){if(!y.error){var i=S.all.products.findIndex(function(z){return z.id===p.id});S.all.products[i]=y.data}renderAdmin()})}
      d.close();renderAdmin();toast("Sale saved")})}
}

boot();
})();
