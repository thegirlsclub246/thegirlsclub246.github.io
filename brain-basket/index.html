*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;

button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.wins b{color:var(--pop);font-family:var(--display);font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.nudge{background:var(--accent);color:var(--on-accent);border:none}

.row{display:flex;align-items:center;gap:10px;min-width:0}
.spread{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;font-weight:700;font-size:.9rem}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px}
.nudge .btn{background:transparent;color:var(--on-accent);border-color:color-mix(in srgb,var(--on-accent) 45%,transparent)}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:.875rem;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
ul.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.items li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
ul.items li:first-child{border-top:none}
.tick{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);background:transparent;display:grid;place-items:center;padding:0}
.tick svg{opacity:0}
li.done .tick{background:var(--accent)} li.done .tick svg{opacity:1}
li.done .txt{text-decoration:line-through;color:var(--muted)}
.txt{flex:1;min-width:0;overflow-wrap:anywhere}
.meta{display:block;font-size:.8rem;color:var(--muted)}
.tag{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-right:6px}
.tag.ex{background:var(--pop-soft);color:var(--ink)}
.icon{flex:none;width:34px;height:34px;border-radius:50%;border:none;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.icon.on{color:var(--pop)}
.empty{color:var(--muted);font-size:.9rem;margin:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;font-size:.875rem;white-space:nowrap}

.chip .n{font-weight:400;opacity:.7;margin-left:4px}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input[type=text],textarea,select,.add input[type=date]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
.add input[type=text]{flex:1 1 180px}
textarea{width:100%;resize:vertical;min-height:84px}
.dots{display:flex;gap:8px}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;font-size:.75rem;font-weight:700;color:var(--muted);padding:0}
.dot.hit{background:var(--pop);border-color:var(--pop);color:var(--ink)}
.dot.today{border-color:var(--ink)}
.timer{font-family:var(--display);font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.step-big{font-family:var(--display);font-size:1.35rem;font-weight:500;line-height:1.3}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}
ol.steps li.d{color:var(--muted);text-decoration:line-through}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.78rem;font-weight:700}
.mood i{width:22px;height:22px;border-radius:50%;display:block}
.mood[aria-pressed="true"]{border-color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:8px;font-weight:700;font-size:.875rem}
.seg button[aria-pressed="true"]{border-color:var(--ink)}
.prompt{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.95rem}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars span{width:100%;max-width:30px;border-radius:6px 6px 3px 3px}
.bars small{font-size:.7rem;color:var(--muted)}
.pattern{border-left:4px solid var(--pop);padding-left:12px;margin:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:none;background:transparent;border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;font-weight:700;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;
  background:var(--pop);color:var(--ink);border:none;border-radius:999px;padding:13px 18px;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.18);display:flex;gap:6px;align-items:center}
.sheet{position:fixed;inset:0;z-index:9;background:rgba(10,16,14,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:700;font-size:.9rem;z-index:10;max-width:calc(100% - 32px);text-align:center}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--bg);border-radius:10px;padding:10px;min-width:0}
.sum b{display:block;font-family:var(--display);font-size:1.05rem;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.amt{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.amt.in{color:var(--accent)}
.conns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.conn{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.conn b{font-size:.95rem}
.conn .btn{align-self:flex-start;padding:6px 12px;font-size:.8rem}
.conn.on{border-color:var(--accent);background:var(--accent-soft)}
.sorted{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.sorted li{display:flex;gap:8px;align-items:baseline;font-size:.9rem}
.notif{display:flex;gap:10px;align-items:flex-start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.notif .ap{flex:none;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-weight:700}
@media (prefers-reduced-motion: no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}
</style>

    <form class="add" id="moneyForm">
      <select id="mKind" aria-label="Type"><option value="expense">Bill / expense</option><option value="income">Income</option></select>
      <input type="text" id="mName" placeholder="e.g. Internet" aria-label="Name" required>
      <input type="text" id="mAmt" inputmode="decimal" placeholder="Amount" aria-label="Amount" required style="flex:0 1 110px">
      <select id="mFreq" aria-label="How often"><option value="monthly">Monthly</option><option value="weekly">Weekly</option><option value="biweekly">Every 2 weeks</option><option value="yearly">Yearly</option><option value="once">Just once</option></select>
      <input type="date" id="mDate" aria-label="Next date">
      <button class="btn primary" type="submit">Add</button></form></section>
  <section class="card"><h2>Recurring bills</h2>${bills.length?`<ul class="items">${bills.map(m=>row(m,false)).join('')}</ul>`:'<p class="empty">No bills yet.</p>'}</section>
  <section class="card"><h2>Income</h2>${ins.length?`<ul class="items">${ins.map(m=>row(m,true)).join('')}</ul>`:'<p class="empty">No income added yet.</p>'}</section>
  <section class="card"><h2>One-off spending</h2>${spent.length?`<ul class="items">${spent.map(m=>`<li><span class="txt">${m.ex?'<span class="tag ex">Example</span>':''}${esc(m.name)}<span class="meta">${fmtDate(m.date)}</span></span><span class="amt">${money(m.amount)}</span><button class="icon" data-act="mdel" data-id="${m.id}" aria-label="Delete ${esc(m.name)}">${svg(X,18)}</button></li>`).join('')}</ul>`:'<p class="empty">Nothing logged.</p>'}
    <p class="muted small" style="margin:0">With your bank connected, spending fills in by itself.</p></section>`;
}
const CONNS=[
  {k:'claude',n:'Claude',d:'Ask in chat: \u201cadd dentist Friday\u201d and it lands here.'},
  {k:'calendar',n:'Calendar',d:'Appointments sync both ways.'},
  {k:'email',n:'Email',d:'Bills and bookings become reminders.'},
  {k:'site',n:'Your website',d:'WordPress or Shopify daily jobs.'},
  {k:'bank',n:'Bank',d:'Spending and bills fill in by themselves.'},
  {k:'chat',n:'WhatsApp / text',d:'Text a thought, it gets sorted.'}
];
function connCard(){return `<section class="card"><div><h2>Connect your life</h2><p class="muted small" style="margin:2px 0 0">Connect your tools so things come in by themselves. In this prototype the buttons only show how it works.</p></div>
  <div class="conns">${CONNS.map(c=>`<div class="conn ${S.conns[c.k]?'on':''}"><b>${c.n}</b><span class="small muted">${c.d}</span><button class="btn" data-act="conn" data-k="${c.k}">${S.conns[c.k]?'Connected':'Connect'}</button></div>`).join('')}</div></section>`}
function autoSort(txt){
  const R=[
    [/\$|\bbill\b|\bpaid\b|\bsubscription\b|\bpay\b/i,'money'],
    [/dentist|doctor|appointment|appt|meeting with|vet\b|haircut|interview/i,'appts'],
    [/\bbuy\b|milk|bread|eggs|grocer|store|shopping/i,'groceries'],
    [/clean|laundry|dishes|vacuum|trash|mop|tidy/i,'chores'],
    [/filter|battery|batteries|warranty|repair|service|fix the/i,'home'],
    [/client|invoice|boss|work|report|deadline|email/i,'work'],
    [/order|blog|post|website|shop|product/i,'site'],
    [/idea|maybe|remember|look up|someday/i,'inbox']
  ];
  const days=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  return txt.split(/\n+/).map(l=>l.trim()).filter(Boolean).map(line=>{
    let list='tasks';for(const [re,l] of R){if(re.test(line)){list=l;break}}
    let date;const dm=line.toLowerCase().match(/\b(today|tomorrow|sunday|monday|tuesday|wednesday|thursday|friday|saturday)\b/);
    if(dm){if(dm[1]==='today')date=today;else if(dm[1]==='tomorrow')date=addDays(1);else{let k=(days.indexOf(dm[1])-new Date().getDay()+7)%7||7;date=addDays(k)}}
    if(list==='appts'&&!date)date=addDays(7);
    const clean=line.replace(/^(buy|get)\s+/i,'').replace(/^\w/,c=>c.toUpperCase());
    if(list==='money'){const am=line.match(/\$\s?([\d,.]+)/);const amt=am?parseFloat(am[1].replace(/,/g,'')):0;
      const freq=/week/i.test(line)?'weekly':/year|annual/i.test(line)?'yearly':'monthly';
      const name=clean.replace(/\$\s?[\d,.]+/,'').replace(/\b(monthly|weekly|yearly|a month|per month)\b/ig,'').trim();
      return {text:name+(amt?' '+money(amt):''),money:{id:uid(),kind:'expense',name:name||'Bill',amount:amt,freq,next:date||addDays(30),cat:'From brain dump'}}}
    return {list,text:clean,date};
  });
}
function render(){
  const v=S.view;
  $app.innerHTML=v==='lists'?viewLists():v==='money'?viewMoney():v==='plan'?viewPlan():v==='feel'?viewFeel():viewToday();
  $tabs.innerHTML=[['today','Today'],['lists','Lists'],['money','Money'],['plan','Plan'],['feel','Feel']].map(([k,n])=>`<button data-view="${k}" ${k===v?'aria-current="page"':''}>${svg(ICON[k])}${n}</button>`).join('');
  save();
}

function openDump(){
  $layer.innerHTML=`<div class="sheet" id="sheet"><form class="panel" id="dumpForm"><h2>Catch that thought</h2><p class="muted small" style="margin:0">Dump everything, one thing per line. We\u2019ll sort it into the right lists for you.</p>
  <textarea id="dumpText" aria-label="Thoughts" placeholder="buy milk and bread&#10;dentist appointment friday&#10;netflix $15.99 monthly" required></textarea>
  <button type="button" class="btn ghost small" style="align-self:flex-start" data-act="dump-example">Try an example</button>
  <div id="sortPreview"></div>
  <div class="row spread"><button type="button" class="btn ghost" data-act="close">Cancel</button><div class="row"><button type="button" class="btn" data-act="sort-preview">Preview</button><button class="btn primary" type="submit">Sort it for me</button></div></div></form></div>`;
  setTimeout(()=>{const t=document.getElementById('dumpText');t&&t.focus()},30);
}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');
  if(e.target.id==='sheet'){$layer.innerHTML='';return}
  if(!b)return;const d=b.dataset;
  if(b.id==='fab')return openDump();
  if(d.view){S.view=d.view;render();window.scrollTo(0,0);return}
  if(d.list){S.list=d.list;render();return}
  if(d.tick){const i=S.items.find(x=>x.id===d.tick);if(!i)return;i.done=!i.done;if(i.done){S.wins++;toast(CHEERS[S.wins%CHEERS.length])}render();return}
  if(d.star){const i=S.items.find(x=>x.id===d.star);if(!i)return;
    if(!i.top&&S.items.filter(x=>x.top).length>=3){toast('Today holds 3 things max. Finish or unstar one first.');return}
    i.top=!i.top;if(i.top)toast('Added to today’s top 3');render();return}
  if(d.del){S.items=S.items.filter(x=>x.id!==d.del);render();return}
  if(d.habit){const k=S.habit.hits.indexOf(d.habit);if(k>=0)S.habit.hits.splice(k,1);else{S.habit.hits.push(d.habit);S.wins++;toast('Habit ticked. Nice.')}render();return}
  if(d.mood){draft.mood=+d.mood;const n=(document.getElementById('feelNote')||{}).value||'';render();const t=document.getElementById('feelNote');if(t)t.value=n;return}
  if(d.energy){draft.energy=d.energy;const n=(document.getElementById('feelNote')||{}).value||'';render();const t=document.getElementById('feelNote');if(t)t.value=n;return}
  if(d.plan){S.planCur=d.plan;render();return}
  if(d.skin!==undefined){S.skin=d.skin;applySkin();save();openSkins();return}
  const p=S.plans.find(x=>x.id===S.planCur)||S.plans[0];
  switch(d.act){
    case 'clear-ex':S.items=S.items.filter(i=>!i.ex);S.moods=S.moods.filter(m=>!m.ex);S.plans=S.plans.filter(p=>!p.ex);S.money=S.money.filter(m=>!m.ex);S.spent=S.spent.filter(m=>!m.ex);S.wins=0;S.habit.hits=[];toast('Examples cleared. It’s all yours now.');break;
    case 'next-nudge':S.nudgeOffset++;break;
    case 'clear-top':S.items.forEach(i=>{if(i.top&&i.done)i.top=false});break;
    case 'focus':S.focusEnd=Date.now()+15*60e3;toast('Focus on. Just this one thing.');break;
    case 'stop-focus':S.focusEnd=0;break;
    case 'step-done':if(p){p.cur++;S.wins++;toast(p.cur>=p.steps.length?'Plan complete!':CHEERS[S.wins%CHEERS.length])}break;
    case 'step-back':if(p&&p.cur>0)p.cur--;break;
    case 'step-today':if(p){if(S.items.filter(x=>x.top).length>=3){toast('Today holds 3 things max. Finish or unstar one first.');return}
      S.items.push({id:uid(),list:'tasks',text:p.steps[p.cur],done:false,top:true,note:'From: '+p.goal});toast('Added to today’s top 3')}break;
    case 'plan-del':if(p){S.plans=S.plans.filter(x=>x.id!==p.id);S.planCur=null}break;
    case 'save-mood':{const note=(document.getElementById('feelNote')||{}).value||'';
      S.moods.push({id:uid(),date:today,mood:draft.mood,energy:draft.energy||'Med',note});draft={mood:null,energy:null};toast('Check-in saved. Thanks for noticing yourself.');break}
    case 'close':$layer.innerHTML='';return;
    case 'skins':openSkins();return;
    case 'remind-on':Notification.requestPermission().then(p=>{if(p==='granted'){S.remind=true;S.remindTime=(document.getElementById('remindTime')||{}).value||'08:00';save();syncReminder();toast('Reminders on. See you at '+fmtTime(S.remindTime)+'.')}else toast('Reminders need notification permission.');render()});return;
    case 'remind-off':S.remind=false;save();syncReminder();toast('Reminders off');break;
    case 'remind-test':notifyNow('Brain Basket',NUDGES[(dayNum+S.nudgeOffset)%NUDGES.length].x).catch(()=>toast('Could not send a test.'));return;
    case 'dump-example':document.getElementById('dumpText').value='buy milk and bread\ndentist appointment friday\nnetflix $15.99 monthly\nemail the client about the invoice\nclean the bathroom\ngift idea for mom';return;
    case 'sort-preview':{const res=autoSort(document.getElementById('dumpText').value);document.getElementById('sortPreview').innerHTML=res.length?`<ul class="sorted">${res.map(x=>`<li><span class="tag">${esc(x.money?'Money':listName(x.list))}</span>${esc(x.text)}${x.date?' \u00b7 '+fmtDate(x.date):''}</li>`).join('')}</ul>`:'';return}
    case 'conn':S.conns[d.k]=!S.conns[d.k];toast(S.conns[d.k]?'Connected (demo)':'Disconnected');break;
    case 'paid':{const m=S.money.find(x=>x.id===d.id);if(m){m.next=nextDate(m.next,m.freq);S.wins++;toast('Marked paid. Next one: '+fmtDate(m.next))}break}
    case 'mdel':S.money=S.money.filter(x=>x.id!==d.id);S.spent=S.spent.filter(x=>x.id!==d.id);break;
    default:return;
  }
  render();
});
document.addEventListener('change',e=>{const s=e.target;if(s.id==='remindTime'){S.remindTime=s.value;save();syncReminder();toast('Reminder time saved');return}if(s.dataset&&s.dataset.move&&s.value){const i=S.items.find(x=>x.id===s.dataset.move);if(i){i.list=s.value;toast('Moved to '+listName(s.value))}render()}});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='addForm'){const t=document.getElementById('addText').value.trim();if(!t)return;const dt=document.getElementById('addDate');
    S.items.push({id:uid(),list:S.list,text:t,done:false,top:false,date:dt&&dt.value?dt.value:undefined,staple:S.list==='groceries'});render();const n=document.getElementById('addText');n&&n.focus();}
  if(f.id==='planForm'){const g=document.getElementById('planText').value.trim();if(!g)return;const np={id:uid(),goal:g,cur:0,steps:breakPlan(g)};S.plans.unshift(np);S.planCur=np.id;render();toast('Here’s your first tiny step')}
  if(f.id==='dumpForm'){const res=autoSort(document.getElementById('dumpText').value);if(!res.length)return;
    res.forEach(x=>{if(x.money)S.money.push(x.money);else S.items.push({id:uid(),list:x.list,text:x.text,done:false,top:false,date:x.date})});
    $layer.innerHTML='';toast('Sorted '+res.length+' thing'+(res.length>1?'s':'')+'. Back to what you were doing.');render()}
  if(f.id==='moneyForm'){const n=document.getElementById('mName').value.trim(),a=parseFloat(document.getElementById('mAmt').value);if(!n||!(a>0))return;
    const kind=document.getElementById('mKind').value,freq=document.getElementById('mFreq').value,dt=document.getElementById('mDate').value||today;
    if(freq==='once'&&kind==='expense')S.spent.push({id:uid(),name:n,amount:a,date:dt});else S.money.push({id:uid(),kind,name:n,amount:a,freq,next:dt,cat:''});
    toast('Saved');render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('sheet'))$layer.innerHTML=''});
setInterval(()=>{const el=document.getElementById('timer');if(!el)return;const left=Math.round((S.focusEnd-Date.now())/1000);
  if(left<=0){S.focusEnd=0;toast('Sprint done! Take a 5-minute break.');S.wins++;render();return}el.textContent=Math.floor(left/60)+':'+pad(left%60)},1000);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>syncReminder()).catch(()=>{})}
applySkin();render();
})();
</script>
