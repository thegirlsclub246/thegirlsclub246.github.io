<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="supported-color-schemes" content="light">
<style>:root{color-scheme:only light}</style>
<meta name="theme-color" content="#3B2257">
<meta name="description" content="5K Mind: free 3-minute quizzes that show you which digital products to sell, or how to grow the sales you have, with step-by-step plans and Claude prompts from a real Barbados business.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="5K Mind">
<title>5K Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap">
<style>
:root{
  --bg:#FBF6F1; --surface:#FFFFFF; --ink:#231A2C; --muted:#6C5F75; --line:#EADFD6;
  --accent:#3B2257; --accent-soft:#ECE4F3; --on-accent:#FFFFFF;
  --spark:#F08A3C; --spark-soft:#FDE6D3; --good:#2E8B6A; --warn:#C2553F;
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(30px,8vw,42px)}
h2{font-size:26px}
h3{font-size:19px}
p{margin:0 0 1em}
.muted{color:var(--muted)}
.small{font-size:14px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px;margin-bottom:28px}
.brand svg{width:28px;height:28px}
.btn{appearance:none;border:0;border-radius:999px;padding:16px 24px;font:700 18px var(--body);cursor:pointer;
  background:var(--accent);color:var(--on-accent);width:100%;min-height:56px}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:3px solid var(--spark);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--line)}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px}
.hero-spark{background:var(--spark-soft);border-radius:var(--r);padding:18px 20px;margin:18px 0 24px}
.hero-spark ul{margin:0;padding-left:20px}
.hero-spark li{margin:4px 0}
/* quiz */
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 6px}
.progress i{display:block;height:100%;background:var(--spark);width:0;transition:width .3s}
.qcount{font-size:14px;color:var(--muted);margin-bottom:22px;display:flex;justify-content:space-between}
.qcount button{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{appearance:none;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:var(--r);padding:16px 18px;font:400 17px/1.35 var(--body);cursor:pointer;min-height:58px}
.opt:hover{border-color:var(--accent)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
/* email */
label{display:block;font-weight:700;margin:0 0 6px}
input[type=text],input[type=email]{width:100%;padding:15px 16px;border:2px solid var(--line);border-radius:12px;
  font:17px var(--body);background:var(--surface);color:var(--ink);margin-bottom:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:15px;color:var(--muted)}
.check input{width:22px;height:22px;margin-top:1px;flex:none}
.err{color:var(--warn);font-size:15px;min-height:1.3em;margin:4px 0 10px}
/* results */
.score{display:flex;align-items:center;gap:20px}
.ring{width:120px;height:120px;flex:none}
.ring text{font-family:var(--display);font-weight:700;fill:var(--ink)}
.bars{display:grid;gap:12px;margin-top:6px}
.bar .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.bar .row span:last-child{white-space:nowrap;padding-left:10px}
.bar .track{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:var(--good)}
.bar.low .fill{background:var(--spark)}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--spark-soft);color:var(--ink)}
ol.steps{padding-left:22px;margin:0}
ol.steps li{margin:0 0 10px}
.week{margin-top:14px}
.week summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:18px;padding:6px 0;list-style:none}
.week summary::-webkit-details-marker{display:none}
.week summary::before{content:"▸ ";color:var(--spark)}
.week[open] summary::before{content:"▾ "}
.task{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-weight:400;cursor:pointer}
.task input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--good)}
.task.done span{text-decoration:line-through;color:var(--muted)}
.task em{display:block;font-style:normal;font-size:14px;color:var(--muted)}
.taskwrap{border-top:1px solid var(--line)}
.taskwrap .task{border-top:0}
.pr{margin:0 0 12px 34px}
.pr summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent);list-style:none}
.pr summary::-webkit-details-marker{display:none}
.pr summary::before,.week .pr summary::before,.week[open] .pr summary::before{content:"✦ "}
.prbox{background:var(--accent-soft);border-radius:12px;padding:12px 14px;margin-top:8px;font-size:15px;line-height:1.45;white-space:pre-wrap}
.copy{appearance:none;border:2px solid var(--accent);background:transparent;color:var(--accent);border-radius:999px;padding:8px 16px;font:700 14px var(--body);cursor:pointer;margin-top:8px}
.start{border:2px solid var(--spark)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--spark-soft);border-radius:12px;padding:10px 8px;text-align:center}
.stats b{display:block;font-family:var(--display);font-size:20px}
.stats span{font-size:12px;color:var(--muted);line-height:1.3;display:block}
.cta{background:var(--accent);color:var(--on-accent);border-radius:var(--r);padding:22px 20px;margin:8px 0 16px}
.cta h3{color:inherit}
.cta a{color:inherit;font-weight:700}
.row-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 16px}
.row-btns .btn{font-size:16px;padding:14px 12px}
.testmode{position:fixed;left:0;right:0;bottom:0;background:var(--warn);color:#fff;font-size:13px;text-align:center;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0))}
footer{margin-top:auto;padding-top:28px;font-size:13px;color:var(--muted);text-align:center}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.progress i{transition:none}}
@media print{.btn,.row-btns,.testmode,.qcount,.cta,footer{display:none!important}body{background:#fff}.week{break-inside:avoid}details>*{display:block}}
</style>
</head>

const QUESTIONS = [
  {id:"type", q:"What do you sell?", opts:[
    {t:"Ebooks or guides", v:"ebook"}, {t:"Templates, planners or printables", v:"template"},

const NOUN = {ebook:"ebook", template:"template", course:"course", app:"app"};

/* Growth plan library. Every task comes from the 1K Month and 5K Month playbooks:
   [title, why / how, Claude prompt]. {p} = what they sell. Fill the [square brackets] before pasting into Claude. */
const LIB = {
  offer:{
    start:[
      ["Set up your scoreboard", "Judge with numbers, not feelings. We once made fast changes with no numbers and couldn't tell what worked.",

       "I sell [digital or physical product] to [buyer]. Suggest 5 [physical / digital] products that would help them use it, with the cost to make, a price, and how I'd offer it at checkout or in a follow-up. Flag which ones I can test before buying stock."],

       "I sell [products]. Create 2 gift offers for [holiday]: a gift voucher and a gift set. For each, write a name, what's included, a price, a 2-line description, and 3 post hooks aimed at people buying for someone else."],

    start:[

      ["Make a free taster", "\"Watch a FREE lesson first\" was one of our best hooks. A taster builds trust and grows your list.",
       "My paid product is my {p}, [name], for [buyer]. Suggest 5 free tasters I could make in under an hour that solve one small problem and make people want the full product. For the best one, write the full content and a closing line that points to [name] at [price]."],
      ["Pick 5 content pillars", "Finding ideas every day is draining. Pillars turn it into a menu. Ours: tips, glow-up Friday, polls, money maths, gifts.",

function quiz(){
  const Q = qs(), q = Q[step];
  const pct = Math.round(step / Q.length * 100);
  show(`<div>${brand}
    <div class="progress" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="qcount"><span>Question ${step+1} of ${Q.length}</span><button id="back">Back</button></div>
    <h2>${esc(q.q)}</h2>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt${answers[q.id]===i?" picked":""}" data-i="${i}">${esc(o.t)}</button>`).join("")}</div>
    <form id="otherBox" class="card" style="margin-top:12px" ${q.opts[answers[q.id]]?.other ? "" : "hidden"} novalidate>
      <label for="otherIn">Tell me what you're good at</label>
      <input type="text" id="otherIn" maxlength="60" placeholder="For example: gardening, nails, budgeting" value="${esc(answers[q.id+"_other"] || "")}">
      <div class="err" id="otherErr" role="alert"></div>
      <button class="btn">Continue</button>
    </form>
    ${foot}</div>`);
  const next = () => { step++; step < Q.length ? quiz() : emailGate(); };
  const box = document.getElementById("otherBox");
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    answers[q.id] = +b.dataset.i;
    app.querySelectorAll(".opt").forEach(x => x.classList.toggle("picked", x === b));
    if (q.opts[answers[q.id]].other) { box.hidden = false; document.getElementById("otherIn").focus(); return; }
    box.hidden = true; delete answers[q.id+"_other"];
    setTimeout(next, 160);
  });
  document.getElementById("otherIn").oninput = () => document.getElementById("otherErr").textContent = "";
  box.onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById("otherIn").value.trim().replace(/\s+/g, " ");
    if (v.length < 2) return document.getElementById("otherErr").textContent = "Type a word or two about what you're good at.";
    answers[q.id+"_other"] = v; next();
  };
  document.getElementById("back").onclick = () => { if (step) { step--; quiz(); } else home(); };
}

function emailGate(){
  show(`<div>${brand}
    <div class="progress"><i style="width:100%"></i></div>
    <div class="qcount"><span>All done!</span><button id="back">Back</button></div>
    <h2>${mode === "find" ? "Your product matches are ready." : "Your growth plan is ready."}</h2>

    <form id="f" novalidate>
      <label for="nm">First name</label>
      <input type="text" id="nm" autocomplete="given-name" required>
      <label for="em">Email</label>
      <input type="email" id="em" autocomplete="email" inputmode="email" required>
      <label class="check"><input type="checkbox" id="ok" required>
        <span>Yes, email me my ${mode === "find" ? "results, tips for my first product" : "plan, growth tips"} and news about new tiny apps. I can unsubscribe anytime.</span></label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="sub">${mode === "find" ? "Show my matches" : "Show my plan"}</button>
    </form>${foot}</div>`);
  document.getElementById("back").onclick = () => { step = qs().length - 1; quiz(); };
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const name = document.getElementById("nm").value.trim();
    const email = document.getElementById("em").value.trim();
    const err = document.getElementById("err");
    if (!name) return err.textContent = "Please add your first name.";
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return err.textContent = "That email doesn't look quite right.";
    if (!document.getElementById("ok").checked) return err.textContent = "Please tick the box so I can send your plan.";
    const btn = document.getElementById("sub"); btn.disabled = true; btn.textContent = mode === "find" ? "Finding your matches..." : "Building your plan...";
    if (mode === "find") {
      const fr = buildFind(name);
      await saveLead(name, email, {quiz:"Product finder", match:PRODUCTS[fr.top[0].k].name});
      store.set("fanswers", answers); store.set("fresult", fr); store.set("fdone", {});
      return findResults(fr);
    }
    const result = build(name);
    await saveLead(name, email, {quiz:"Growth quiz", score:result.total, focus:AREAS[result.focus].name, sells:result.type});
    store.set("answers", answers); store.set("result", result); store.set("done", {});
    results(result);
  };
}

async function saveLead(name, email, extra){
  const fields = {name, email, ...extra};
  try {
    const formId = mode === "find" ? (CONFIG.mailerliteFinderFormId || CONFIG.mailerliteFormId) : CONFIG.mailerliteFormId;
    if (CONFIG.mailerliteAccountId && formId) {
      const fd = new FormData();
      fd.append("fields[email]", email); fd.append("fields[name]", name);
      fd.append("ml-submit", "1"); fd.append("anticsrf", "true");
      await fetch(`https://assets.mailerlite.com/jsonp/${encodeURIComponent(CONFIG.mailerliteAccountId)}/forms/${encodeURIComponent(formId)}/subscribe`,
        {method:"POST", body:fd, mode:"no-cors"});
    } else if (CONFIG.otherFormUrl) {
      const fd = new FormData(); Object.entries(fields).forEach(([k,v]) => fd.append(k, v));
      await fetch(CONFIG.otherFormUrl, {method:"POST", body:fd, mode:"no-cors"});
    } else {
      console.warn("Shop Spark test mode: email not sent anywhere.", fields);
    }
  } catch(e) { console.warn("Could not save email", e); }
}

/* ---------- scoring + plan ---------- */
function build(name){
  const sc = {offer:0, audience:0, traffic:0, sales:0};
  QUESTIONS.forEach(q => { if (q.area) sc[q.area] += q.opts[answers[q.id] ?? 0].s; });
  const pct = {}; Object.keys(sc).forEach(k => pct[k] = Math.round(sc[k] / 6 * 100));
  const total = Math.round(Object.values(pct).reduce((a,b)=>a+b,0) / 4);
  const order = Object.keys(pct).sort((a,b) => pct[a]-pct[b]);
  const type = QUESTIONS[0].opts[answers.type ?? 0].v;
  const block = QUESTIONS.find(q => q.id === "block").opts[answers.block ?? 0].v;
  const p = NOUN[type];
  const fill = s => s.replace(/\{p\}/g, p);
  // weeks: weakest area first; each week takes 4 tasks from that area (start set if < 70%, grow set otherwise)
  const weeks = order.map(a => ({area:a, tasks:(pct[a] < 70 ? LIB[a].start : LIB[a].grow).map(([t,d,pr]) => [fill(t), fill(d), fill(pr)])}));
  const top3 = [weeks[0].tasks[0], weeks[0].tasks[1], weeks[1].tasks[0]];
  const ans = id => { const q = QUESTIONS.find(x => x.id === id); return lc(q.opts[answers[id] ?? 0].t); };
  const startPrompt = `I sell ${ans("type")} from Barbados. I've been selling: ${ans("stage")}. Can I describe my buyer in one sentence: ${ans("who")}. How I feel about my price: ${ans("price")}. My email list: ${ans("list")}. I show up: ${ans("show")}. Most buyers find me through: ${ans("where")}. My buy link: ${ans("page")}. Sales in a normal month: ${ans("sales")}. After someone buys: ${ans("repeat")}. My biggest block: ${ans("block")}. My weakest area is ${AREAS[order[0]].name} and my strongest is ${AREAS[order[3]].name}. Act as my business coach. Tell me, in simple steps, the 3 actions with the biggest impact on my sales in the next 30 days, what to stop doing, and what number to track each week. Be direct, and don't promise income.`;
  return {name, total, pct, order, focus:order[0], strong:order[3], type, block, weeks, top3, startPrompt};
}

function level(t){
  if (t < 35) return ["Spark stage", "You're at the start, and that's a great place to be. A few basics will make a big difference fast."];
  if (t < 60) return ["Building stage", "The foundations are there. Fixing your weakest area will unlock the next level."];
  if (t < 80) return ["Growing stage", "You're doing a lot right. Now it's about doing more of what works."];
  return ["Glowing stage", "You're ahead of most sellers. Your plan focuses on scaling up."];
}

          <circle cx="60" cy="60" r="50" fill="none" stroke="var(--spark)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${off}" transform="rotate(-90 60 60)"/>
          <text x="60" y="68" text-anchor="middle" font-size="32">${r.total}</text></svg>

      <div class="bars">${Object.keys(AREAS).map(a => `

        <div class="track"><div class="fill" style="width:${Math.max(r.pct[a],3)}%"></div></div></div>`).join("")}</div>

      <p class="small muted" style="margin:6px 0 0"><strong>About your block:</strong> ${esc(BLOCK_TIPS[r.block])}</p>
    </div>

    <div class="card">
      <h3>Your 30-day plan</h3>
      <p class="small muted">One area a week, weakest first. One task a day, 30 to 60 minutes. Ticks are saved on this phone.</p>
      ${r.weeks.map((w,wi) => `<details class="week"${wi===0?" open":""}>

        ${w.tasks.map(([t,d,pr],ti) => taskHTML(wi+"-"+ti, done, t, d, pr)).join("")}
      </details>`).join("")}
      <p class="small muted" style="margin:14px 0 0">Days 29 and 30: look back at your scoreboard. What worked? Do more of that, then retake the quiz to see your new score.</p>
    </div>

    ${lessonsCard("grow")}

    ${sellCard()}

    <div class="row-btns">
      <button class="btn ghost" id="print">Save as PDF</button>
      <button class="btn ghost" id="share">Share the quiz</button>
    </div>

    <div class="cta">
      <h3>${esc(CONFIG.promoTitle)}</h3>
      <p style="margin:0${CONFIG.promoLink?" 0 14px":""}">${esc(CONFIG.promoText)}</p>
      ${CONFIG.promoLink ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;background:var(--spark);color:#231A2C" href="${esc(CONFIG.promoLink)}" target="_blank" rel="noopener">${esc(CONFIG.promoButton)}</a>` : ""}
    </div>

    <button class="btn ghost" id="retake">Retake the quiz</button>
    ${foot}</div>`);
  app.querySelectorAll(".task input").forEach(c => c.onchange = () => {
    const d = store.get("done") || {}; d[c.dataset.k] = c.checked; store.set("done", d);
    c.closest(".task").classList.toggle("done", c.checked);
  });
  wireCopy();
  document.getElementById("print").onclick = () => { app.querySelectorAll("details").forEach(d => d.open = true); window.print(); };

    if (navigator.share) { try { await navigator.share(data); } catch(e){} }
    else { try { await navigator.clipboard.writeText(data.url); document.getElementById("share").textContent = "Link copied!"; } catch(e){} }
  };
  document.getElementById("retake").onclick = () => start("grow");
}

/* ---------- product finder: scoring + results ---------- */
function buildFind(name){
  const pts = {}, why = {};
  Object.keys(PRODUCTS).forEach(k => { pts[k] = 0; why[k] = []; });
  FIND_QS.forEach(q => {
    const o = q.opts[answers[q.id] ?? 0];
    const r = o.other ? `you know a lot about ${answers[q.id+"_other"] || "your topic"}` : o.r;
    Object.entries(o.p).forEach(([k,v]) => { pts[k] += v; if (v >= 2) why[k].push(r); });
  });
  const ranked = Object.keys(PRODUCTS).sort((a,b) => pts[b] - pts[a]);
  const best = Math.max(pts[ranked[0]], 1);
  const top = ranked.slice(0,3).map(k => ({k, fit:Math.max(40, Math.min(98, Math.round(pts[k] / best * 95))), why:why[k].slice(0,3)}));
  const t = id => { const q = FIND_QS.find(x => x.id === id), o = q.opts[answers[id] ?? 0]; return lc(o.other ? answers[id+"_other"] : o.t); };
  const startPrompt = `I live in Barbados. I'm good at ${t("skill")}. People ask me about: ${t("asked")}. I have ${t("time")} a week. I'd love to help ${t("who")}. On camera: ${t("camera")}. Tools I'm comfortable with: ${t("tools")}. Followers: ${t("followers")}. What I want first: ${t("goal")}. Suggest 6 digital products I could sell this month. For each, tell me who buys it, what's included, a starter price in US$ and BBD, and what I'd need to make it in one week. Then tell me which one to start with and why. Keep it simple, I'm a beginner.`;
  return {name, top, skill:answers.skill_other || "", startPrompt};
}

/* Product ideas made from the skill someone typed under "Something else". */
function skillIdeas(skill){
  const t = skill.replace(/^(i'?m good at|i am good at|good at)\s+/i, "");
  const T = t.charAt(0).toUpperCase() + t.slice(1);
  return [
    ["Checklist", `"The ${T} Starter Checklist": the 10 to 15 steps you always follow, on one page.`, "US$3 to US$7"],
    ["Guide", `"${T} for Beginners": a 15 to 25 page guide answering the questions people ask you about ${t}.`, "US$9 to US$19"],
    ["Mini course", `"Learn ${T} in 5 Lessons": short phone-filmed videos showing how you do it.`, "US$29 to US$79"]
  ];
}

function whyText(list){
  if (!list.length) return "It's a simple, low-risk way to make your first sale.";
  const s = list.length === 1 ? list[0] : list.slice(0,-1).join(", ") + " and " + list[list.length-1];
  return "It fits because " + s + ".";
}

        <div class="bar${i?"":" low"}"><div class="row"><span><strong>${i+1}. ${esc(PRODUCTS[t.k].name)}</strong>${i?"":" · best match"}</span><span>${t.fit}% fit</span></div>

      <ol class="steps">${P.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol>
    </div>`; }).join("")}

    <div class="card">

      <p class="small muted" style="margin:14px 0 0">Once you've made your first sales, take the growth quiz to see your score and what to work on next.</p>
    </div>

    ${lessonsCard("find")}

      <button class="btn ghost" id="share">Share the quiz</button>
    </div>

    <div class="cta">
      <h3>${esc(CONFIG.promoTitle)}</h3>
      <p style="margin:0${CONFIG.promoLink?" 0 14px":""}">${esc(CONFIG.promoText)}</p>
      ${CONFIG.promoLink ? `<a class="btn" style="display:block;text-align:center;text-decoration:none;background:var(--spark);color:#231A2C" href="${esc(CONFIG.promoLink)}" target="_blank" rel="noopener">${esc(CONFIG.promoButton)}</a>` : ""}
    </div>

    <button class="btn ghost" id="growq" style="margin-bottom:10px">Already selling? Take the growth quiz</button>
    <button class="btn ghost" id="retake">Retake the product finder</button>
    ${foot}</div>`);
  app.querySelectorAll(".task input").forEach(c => c.onchange = () => {
    const d = store.get("fdone") || {}; d[c.dataset.k] = c.checked; store.set("fdone", d);
    c.closest(".task").classList.toggle("done", c.checked);
  });
  wireCopy();
  document.getElementById("print").onclick = () => { app.querySelectorAll("details").forEach(d => d.open = true); window.print(); };
  document.getElementById("share").onclick = async () => {
    const data = {title:CONFIG.appName, text:"I just found out which digital products suit me. Try the free 3-minute quiz:", url:location.href.split("#")[0]};
    if (navigator.share) { try { await navigator.share(data); } catch(e){} }
    else { try { await navigator.clipboard.writeText(data.url); document.getElementById("share").textContent = "Link copied!"; } catch(e){} }
  };
  document.getElementById("growq").onclick = () => start("grow");
  document.getElementById("retake").onclick = () => start("find");
}

home();
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
